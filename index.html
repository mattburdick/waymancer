<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Waymancer — fly through the real 25 parsec stellar neighborhood. 5,000+ star systems from the Fifth Catalogue of Nearby Stars."
    />
    <title>Waymancer — the local stellar neighborhood</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #030409;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #map {
        width: 100%;
        height: 100%;
        display: block;
        outline: none;
      }
      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        color: #cdd6e4;
        background: rgba(10, 14, 24, 0.72);
        border: 1px solid rgba(90, 110, 140, 0.35);
        border-radius: 8px;
        padding: 10px 14px;
        max-width: 340px;
      }
      #hud h1 {
        font-size: 15px;
        margin: 0 0 4px;
        letter-spacing: 0.06em;
      }
      #hud p {
        font-size: 12px;
        margin: 2px 0;
        color: #93a1b8;
      }
      #hud .selected {
        color: #e8eef8;
        font-size: 13px;
        min-height: 1.2em;
      }
      #hud button {
        margin-top: 6px;
        font-size: 12px;
        color: #cdd6e4;
        background: rgba(60, 80, 110, 0.4);
        border: 1px solid rgba(90, 110, 140, 0.5);
        border-radius: 5px;
        padding: 3px 10px;
        cursor: pointer;
      }
      #hud button:hover {
        background: rgba(80, 105, 140, 0.5);
      }
      .wm-system-label {
        top: 0;
        left: 0;
        color: #d7dfeb;
        font-size: 11px;
        letter-spacing: 0.03em;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        white-space: nowrap;
        will-change: transform;
        background: rgba(6, 9, 18, 0.55);
        padding: 1px 7px;
        border-radius: 999px;
      }
      .wm-map-controls {
        display: flex;
        gap: 14px;
        align-items: center;
        font-size: 11px;
        color: #9fb0c8;
      }
      .wm-map-controls label {
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .wm-map-controls input[type="range"] {
        width: 90px;
        accent-color: #5b7ba6;
      }
      .wm-map-controls input[type="checkbox"] {
        accent-color: #5b7ba6;
      }
      .wm-search {
        display: flex;
        flex-direction: column;
        gap: 7px;
        margin-top: 4px;
        padding-top: 8px;
        border-top: 1px solid rgba(90, 110, 140, 0.3);
        font-size: 11px;
        color: #9fb0c8;
      }
      .wm-search-field {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .wm-search input[type="search"] {
        flex: 1;
        min-width: 0;
        font-size: 12px;
        color: #e8eef8;
        background: rgba(6, 9, 18, 0.7);
        border: 1px solid rgba(90, 110, 140, 0.5);
        border-radius: 5px;
        padding: 4px 9px;
      }
      .wm-search input[type="search"]::-moz-placeholder {
        color: #6b7a92;
      }
      .wm-search input[type="search"]::placeholder {
        color: #6b7a92;
      }
      .wm-search-count {
        min-width: 74px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .wm-search label {
        display: flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .wm-search input[type="checkbox"] {
        accent-color: #5b7ba6;
      }
      .wm-search-distance {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      .wm-search-distance input[type="range"] {
        flex: 1;
        min-width: 120px;
        accent-color: #5b7ba6;
      }
      .wm-search-distance[data-disabled="true"] {
        opacity: 0.5;
      }
      .wm-search-distance output {
        min-width: 34px;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
    </style>
    <script type="module" crossorigin src="/waymancer/assets/index-Dn54PRcd.js"></script>
  </head>
  <body>
    <canvas id="map" touch-action="none"></canvas>
    <div id="hud">
      <h1>WAYMANCER</h1>
      <p id="dataset">Loading the neighborhood…</p>
      <p>Drag to orbit · wheel to zoom · click a star to fly in · Esc to fly home</p>
      <p class="selected" id="selection">Nothing selected</p>
      <p>
        <button id="home" type="button">Back to Sol</button>
        <button id="view-system" type="button" hidden>View system ▸</button>
      </p>
      <p class="wm-map-controls">
        <label>Glow <input id="glow" type="range" min="0" max="1.5" step="0.05" value="1" /></label>
        <label><input id="anaglyph-3d" type="checkbox" /> 3D (red/cyan glasses)</label>
      </p>
      <div class="wm-search">
        <div class="wm-search-field">
          <input
            id="star-search"
            type="search"
            placeholder="Search stars by name…"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search stars by name"
          />
          <span class="wm-search-count" id="search-count"></span>
        </div>
        <label><input id="planets-only" type="checkbox" /> Stars with planets only</label>
        <label class="wm-search-distance" id="distance-field" data-disabled="true">
          Within
          <input
            id="distance-range"
            type="range"
            min="0"
            max="8"
            step="0.5"
            value="0"
            list="distance-ticks"
            disabled
          />
          <output id="distance-value">off</output>
          of <span id="distance-anchor">selection</span>
          <datalist id="distance-ticks">
            <option value="0"></option>
            <option value="0.5"></option>
            <option value="1"></option>
            <option value="1.5"></option>
            <option value="2"></option>
            <option value="2.5"></option>
            <option value="3"></option>
            <option value="3.5"></option>
            <option value="4"></option>
            <option value="4.5"></option>
            <option value="5"></option>
            <option value="5.5"></option>
            <option value="6"></option>
            <option value="6.5"></option>
            <option value="7"></option>
            <option value="7.5"></option>
            <option value="8"></option>
          </datalist>
        </label>
      </div>
    </div>
  </body>
</html>
